# Nginx site config for the SSM Centring Rentals CRM.
# Copy to /etc/nginx/sites-available/ssm-crm, symlink into sites-enabled/,
# replace YOUR_DOMAIN, then run `certbot --nginx -d YOUR_DOMAIN` to add HTTPS
# (Certbot rewrites this file in place to add the TLS server block — don't
# hand-maintain the HTTPS half afterwards).

server {
    listen 80;
    server_name YOUR_DOMAIN;

    client_max_body_size 10M;

    location /static/ {
        alias /opt/ssm-crm/webapp/staticfiles/;
    }

    location / {
        proxy_pass http://unix:/run/ssm-crm/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
