  <rect x="7" y="17" width="6" height="13" fill="#1a3a6b"/>
  <polygon points="7,17 10,13 13,17" fill="#1a3a6b"/>
  <rect x="15" y="9" width="7" height="21" fill="#1a3a6b"/>
  <polygon points="15,9 18.5,4 22,9" fill="#1a3a6b"/>
