<!-- SSM (Sri Sai Murugan Centring Rentals) logo mark: abstract navy/green skyline icon, -->
<!-- approximating the real business-card logo (hand-authored, not a vector trace of the -->
<!-- original file). Swap this file for the real vector asset if one becomes available — -->
<!-- rentals/templates/rentals/_sidebar_nav.html references it by this same path, so no -->
<!-- template change is needed. The company name text next to it is separate and -->
<!-- configurable via the COMPANY_NAME setting. -->
