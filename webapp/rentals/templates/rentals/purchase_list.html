{% extends "base.html" %}
{% block title %}Product Purchases - {{ company_name }}{% endblock %}
{% block page_title %}Product Purchases{% endblock %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <div class="d-flex align-items-center gap-2">
        <div class="entity-badge entity-badge-green"><i data-lucide="shopping-bag"></i></div>
        <div>
            <div class="fw-semibold">Product Purchases</div>
            <div class="text-muted small">Stock buy-in log</div>
        </div>
    </div>
    <a href="{% url 'rentals:purchase_new' %}" class="btn btn-primary btn-sm">
        <i data-lucide="plus"></i> Add purchase
    </a>
</div>

<div class="mb-3" style="max-width:360px">
    <input type="search" name="q" class="form-control form-control-sm" placeholder="Search purchases..."
           value="{{ request.GET.q|default:'' }}"
           hx-get="{% url 'rentals:purchase_list' %}"
           hx-trigger="input changed delay:300ms, search"
           hx-target="#purchase-rows" hx-select="#purchase-rows" hx-swap="outerHTML" hx-push-url="true">
</div>

{% include "rentals/_purchase_rows.html" %}

{% endblock %}
