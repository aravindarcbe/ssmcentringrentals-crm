{% if is_paginated %}
<div class="d-flex justify-content-between align-items-center mt-2 px-1" style="font-size:0.8rem">
    <span class="text-muted">Page {{ page_obj.number }} of {{ paginator.num_pages }} &middot; {{ paginator.count }} total</span>
    <div class="d-flex gap-2">
        {% if page_obj.has_previous %}
        <a href="?q={{ request.GET.q|default:'' }}&page={{ page_obj.previous_page_number }}"
           hx-get="?q={{ request.GET.q|default:'' }}&page={{ page_obj.previous_page_number }}"
           hx-target="#{{ rows_id }}" hx-select="#{{ rows_id }}" hx-swap="outerHTML" hx-push-url="true"
           class="btn btn-sm btn-outline-secondary">Previous</a>
        {% endif %}
        {% if page_obj.has_next %}
        <a href="?q={{ request.GET.q|default:'' }}&page={{ page_obj.next_page_number }}"
           hx-get="?q={{ request.GET.q|default:'' }}&page={{ page_obj.next_page_number }}"
           hx-target="#{{ rows_id }}" hx-select="#{{ rows_id }}" hx-swap="outerHTML" hx-push-url="true"
           class="btn btn-sm btn-outline-secondary">Next</a>
        {% endif %}
    </div>
</div>
{% endif %}
