{% extends "base.html" %}
{% block title %}Payments - {{ company_name }}{% endblock %}
{% block page_title %}Payments{% endblock %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <div class="d-flex align-items-center gap-2">
        <div class="entity-badge entity-badge-navy"><i data-lucide="wallet"></i></div>
        <div>
            <div class="fw-semibold">Payments</div>
            <div class="text-muted small">Outgoing payments — salary, loans, misc.</div>
        </div>
    </div>
    <a href="{% url 'rentals:payment_new' %}" class="btn btn-primary btn-sm">
        <i data-lucide="plus"></i> Add payment
    </a>
</div>

<div class="mb-3" style="max-width:360px">
    <input type="search" name="q" class="form-control form-control-sm" placeholder="Search payments..."
           value="{{ request.GET.q|default:'' }}"
           hx-get="{% url 'rentals:payment_list' %}"
           hx-trigger="input changed delay:300ms, search"
           hx-target="#payment-rows" hx-select="#payment-rows" hx-swap="outerHTML" hx-push-url="true">
</div>

{% include "rentals/_payment_rows.html" %}

{% endblock %}
