{% extends "base.html" %}
{% block title %}Receipts - {{ company_name }}{% endblock %}
{% block page_title %}Receipts{% endblock %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <div class="d-flex align-items-center gap-2">
        <div class="entity-badge entity-badge-green"><i data-lucide="banknote"></i></div>
        <div>
            <div class="fw-semibold">Receipts</div>
            <div class="text-muted small">Money received against rental invoices</div>
        </div>
    </div>
    <a href="{% url 'rentals:receipt_new' %}" class="btn btn-primary btn-sm">
        <i data-lucide="plus"></i> Add receipt
    </a>
</div>

<div class="mb-3" style="max-width:360px">
    <input type="search" name="q" class="form-control form-control-sm" placeholder="Search by invoice or customer..."
           value="{{ request.GET.q|default:'' }}"
           hx-get="{% url 'rentals:receipt_list' %}"
           hx-trigger="input changed delay:300ms, search"
           hx-target="#receipt-rows" hx-select="#receipt-rows" hx-swap="outerHTML" hx-push-url="true">
</div>

{% include "rentals/_receipt_rows.html" %}

{% endblock %}
