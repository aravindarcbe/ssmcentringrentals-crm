<div id="category-rows">
    <div class="card">
        <table>
            <thead>
                <tr><th>Name</th><th>Rate Unit</th><th></th></tr>
            </thead>
            <tbody>
                {% for c in categories %}
                <tr>
                    <td>{{ c.name }}</td>
                    <td>{{ c.get_default_rate_unit_display }}</td>
                    <td class="text-end">
                        <a href="{% url 'rentals:category_edit' c.pk %}" class="btn btn-sm btn-icon btn-outline-secondary" title="Edit"><i data-lucide="pencil"></i></a>
                        <button type="button" class="btn btn-sm btn-icon btn-outline-secondary text-danger" title="Delete"
                                hx-delete="{% url 'rentals:category_delete' c.pk %}"
                                hx-confirm="Delete {{ c.name }}?"
                                hx-target="closest tr" hx-swap="outerHTML swap:0.15s"><i data-lucide="trash-2"></i></button>
                    </td>
                </tr>
                {% empty %}
                <tr><td colspan="3" class="text-center text-muted py-4">No categories yet.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    {% include "rentals/_pagination.html" with rows_id="category-rows" %}
</div>
