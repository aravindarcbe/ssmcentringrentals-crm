{% load static text_filters %}
<div class="brand">
    <div class="brand-logo"><img src="{% static 'rentals/img/logo.svg' %}" alt="{{ company_name }} logo"></div>
    <div class="brand-name">
        <div class="brand-name-main">Sri Sai Murugan</div>
        <div class="brand-name-sub">Centring Rentals</div>
    </div>
</div>
<nav class="flex-grow-1 py-2">
    <div class="nav-section-label">Overview</div>
    <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="{% url 'rentals:dashboard' %}" title="Dashboard">
        <i data-lucide="layout-dashboard"></i> <span class="nav-label">Dashboard</span>
    </a>

    <div class="nav-section-label">Catalog</div>
    <a class="nav-link {% if '/customers/' in request.path %}active{% endif %}" href="{% url 'rentals:customer_list' %}" title="Customers">
        <i data-lucide="users"></i> <span class="nav-label">Customers</span>
    </a>
    <a class="nav-link {% if '/materials/' in request.path %}active{% endif %}" href="{% url 'rentals:material_list' %}" title="Materials">
        <i data-lucide="package"></i> <span class="nav-label">Materials</span>
    </a>
    <a class="nav-link {% if '/categories/' in request.path %}active{% endif %}" href="{% url 'rentals:category_list' %}" title="Categories">
        <i data-lucide="tag"></i> <span class="nav-label">Categories</span>
    </a>

    <div class="nav-section-label">Rentals</div>
    <a class="nav-link {% if request.path == '/rentals/new/' %}active{% endif %}" href="{% url 'rentals:rental_new' %}" title="New Rental">
        <i data-lucide="circle-plus"></i> <span class="nav-label">New Rental</span>
    </a>
    <a class="nav-link {% if '/rental-transactions/' in request.path %}active{% endif %}" href="{% url 'rentals:rentaltransaction_list' %}" title="Rental Transactions">
        <i data-lucide="arrow-left-right"></i> <span class="nav-label">Rental Transactions</span>
    </a>
    <a class="nav-link {% if '/stock-movements/' in request.path %}active{% endif %}" href="{% url 'rentals:stockmovement_list' %}" title="Stock Movements">
        <i data-lucide="clipboard-list"></i> <span class="nav-label">Stock Movements</span>
    </a>

    <div class="nav-section-label">Money</div>
    <a class="nav-link {% if '/receipts/' in request.path %}active{% endif %}" href="{% url 'rentals:receipt_list' %}" title="Receipts">
        <i data-lucide="banknote"></i> <span class="nav-label">Receipts</span>
    </a>
    <a class="nav-link {% if '/payments/' in request.path %}active{% endif %}" href="{% url 'rentals:payment_list' %}" title="Payments">
        <i data-lucide="wallet"></i> <span class="nav-label">Payments</span>
    </a>
    <a class="nav-link {% if '/purchases/' in request.path %}active{% endif %}" href="{% url 'rentals:purchase_list' %}" title="Product Purchases">
        <i data-lucide="shopping-bag"></i> <span class="nav-label">Product Purchases</span>
    </a>
    <a class="nav-link {% if '/expenses/' in request.path %}active{% endif %}" href="{% url 'rentals:expense_list' %}" title="Daily Expenses">
        <i data-lucide="receipt"></i> <span class="nav-label">Daily Expenses</span>
    </a>

    <div class="nav-section-label">All sections</div>
    <a class="nav-link {% if request.path == '/manage/' %}active{% endif %}" href="{% url 'rentals:manage' %}" title="Manage">
        <i data-lucide="layout-grid"></i> <span class="nav-label">Manage</span>
    </a>
    <a class="nav-link {% if '/import-data/' in request.path %}active{% endif %}" href="{% url 'rentals:excel_import' %}" title="Import Data">
        <i data-lucide="upload"></i> <span class="nav-label">Import Data</span>
    </a>
</nav>
