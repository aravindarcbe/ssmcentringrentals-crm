{% extends "base.html" %}
{% block title %}Customers - {{ company_name }}{% endblock %}
{% block page_title %}Customers{% endblock %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <div class="d-flex align-items-center gap-2">
        <div class="entity-badge entity-badge-navy"><i data-lucide="users"></i></div>
        <div>
            <div class="fw-semibold">Customers</div>
            <div class="text-muted small">Names, phone numbers, and addresses</div>
        </div>
    </div>
    <a href="{% url 'rentals:customer_new' %}" class="btn btn-primary btn-sm">
        <i data-lucide="plus"></i> Add customer
    </a>
</div>

<div class="mb-3" style="max-width:360px">
    <input type="search" name="q" class="form-control form-control-sm" placeholder="Search customers..."
           value="{{ request.GET.q|default:'' }}"
           hx-get="{% url 'rentals:customer_list' %}"
           hx-trigger="input changed delay:300ms, search"
           hx-target="#customer-rows" hx-select="#customer-rows" hx-swap="outerHTML" hx-push-url="true">
</div>

{% include "rentals/_customer_rows.html" %}

{% endblock %}
